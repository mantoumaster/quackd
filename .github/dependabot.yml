version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # uv.lock is what CI actually tests; the floors in pyproject.toml are hand-written and say
    # what a consumer may install against. Without this, a weekly bump raises those floors to
    # whatever it just locked -- #15 turned openai>=1.50 into >=3.11.0 across ten lines, and
    # narrowed all eight vendor extras for a reason no test ever asked for. Lock-only keeps the
    # two apart: dependabot moves the lock, a person moves a floor and says why.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    # Dependabot asks uv for one version of a package in every split of the lock at once, the
    # newest PyPI has, and for the first five below uv finds none while something else in the
    # lock holds them back. Each of those has failed the whole job every week since 2026-09-11.
    # Only the versions the hold rules out are ignored, so a release inside it still comes in
    # the group. Drop an entry once what holds it back moves. hatchling, the last, is not held.
    ignore:
      # lerobot 0.6, the arm's SDK on Python 3.12 and later, pins numpy>=2.0.0,<2.3.0.
      - dependency-name: "numpy"
        versions: [">=2.3.0"]
      # lerobot 0.6 pins opencv-python-headless>=4.9.0,<4.14.0 the same way.
      - dependency-name: "opencv-python-headless"
        versions: [">=4.14.0"]
      # From 8.4.124 on, ultralytics wants numpy under 2.0 or past 2.3.4 on macOS, and lerobot's
      # numpy>=2.0.0,<2.3.0 leaves it nothing there. The other platforms' split can still move:
      # a person runs uv lock --upgrade-package ultralytics.
      - dependency-name: "ultralytics"
        versions: [">=8.4.124"]
      # google-genai, behind quackd[gemini] and quackd[all], pins websockets>=13.0.0,<17.0, so
      # 16.x can still come in the group.
      - dependency-name: "websockets"
        versions: [">=17.0"]
      # aiortc, behind quackd-microduck[camera], pins av>=14.0.0,<18.0.0.
      - dependency-name: "av"
        versions: [">=18.0.0"]
      # hatchling resolves: uv lock --upgrade-package hatchling moves it to 1.32.4. Dependabot's
      # uv updater stops on that update with No files have changed! before it runs uv, and every
      # run since 2026-09-25 has failed on it. 1.32.4 is the one release it has tried, so only
      # 1.32.4 is ignored and the next release comes in the group. If the next stops the same
      # way, the updater cannot move hatchling at all, and this entry drops its versions.
      - dependency-name: "hatchling"
        versions: ["1.32.4"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
